depth_fusion_node:
  ros__parameters:
    topics:
      tracks: "/perception/tracks"
      depth_image: "/camera/depth/image_raw"
      depth_camera_info: "/camera/depth/camera_info"
      sony_camera_info: "/sony/camera_info"
      targets_3d: "/perception/targets_3d"
      debug_image: "/perception/targets_3d_debug"

    frames:
      sony_optical: "sony_camera_optical_frame"
      gemini_depth_optical: "camera_depth_optical_frame"

    projection:
      # Reproject every Nth Gemini depth pixel into the Sony image. 2 is a
      # practical Jetson default; use 1 for maximum density.
      depth_pixel_stride: 2
      min_target_samples: 40
      # Keep false when both CameraInfo streams describe rectified images.
      use_distortion: false

    depth:
      min_meters: 0.30
      max_meters: 10.0
      min_valid_ratio: 0.10
      # 0.40 favours the person's foreground over background inside a bbox.
      percentile: 0.40

    filter:
      # alpha=1 uses the new measurement directly; lower values smooth more.
      position_alpha: 0.35
      velocity_alpha: 0.25
      max_position_jump_meters: 1.25
      retention_seconds: 3.0

    timing:
      max_sync_skew_seconds: 0.050
      tracks_timeout_seconds: 0.50
      depth_timeout_seconds: 0.50

    debug:
      publish_image: false
