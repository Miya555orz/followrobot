tron1_safety_limiter:
  ros__parameters:
    input_topic: "/fcr/cmd_vel_stamped"
    output_topic: "/fcr_tron/cmd_vel"
    estop_topic: "/safety/estop_state"
    estop_clear_topic: "/tron1/limiter_clear_estop"
    motion_authorized_topic: "/tron1/motion_authorized"

    publish_rate_hz: 50.0
    input_timeout_sec: 0.25
    motion_authorized_timeout_sec: 0.50

    # First-test TRON1 EDU limits. Keep these extremely low until the simulator
    # and real robot have both passed stop-distance checks. TRON1 is heavy and
    # can become unsafe quickly if a joystick or autonomy path bypasses limits.
    max_linear_x: 0.03
    max_linear_y: 0.0
    max_angular_z: 0.10

    max_accel_x: 0.06
    max_accel_y: 0.06
    max_accel_yaw: 0.20

    enable_motion: false
    enable_lateral: false
    stop_immediately_on_estop: true
    stop_immediately_on_zero_cmd: true
    stop_immediately_on_timeout: true
