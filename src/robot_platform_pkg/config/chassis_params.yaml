# robot_platform_pkg/config/chassis_params.yaml
# LEKIWI 三全向轮底盘参数
chassis_driver:
  ros__parameters:
    use_sim: false                   # true = 仿真模式，无需串口硬件
    serial_device: "/dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7A058979-if00"
    baudrate: 1000000                # LeRobot/STS3215 默认波特率
    max_linear_velocity: 0.08        # 实车跟随速度上限 (m/s)
    max_angular_velocity: 0.25       # 已完成实车低速验收 (rad/s)
    wheel_radius: 0.05               # 全向轮半径 (m)，用于运动学解算
    base_radius: 0.125               # LeRobot 默认值，实车测量后修正 (m)
    left_wheel_id: 7
    back_wheel_id: 8
    right_wheel_id: 9
    # 新 base_link +X 从底盘中心指向 right_wheel_id=9；相对原生轮组坐标为 -60°。
    base_heading_offset_deg: -60.0
    max_raw_wheel_velocity: 1000     # 覆盖 0.08m/s 平移，仍保留硬件安全限幅
    command_timeout_ms: 250          # 丢失 /cmd_vel 后自动停车
    state_publish_rate_hz: 10.0      # 三轮同步反馈较慢；避免阻塞 50Hz 控制指令
    enable_emergency_stop: true      # 启用急停检测（丢失控制信号时自动停车）
